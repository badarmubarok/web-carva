# Apache vhost — carva.elps.co.id  (PT Abhinaya Carva Utama)
# Pasang di 192.168.1.30 sebagai /etc/apache2/sites-available/carva.elps.co.id.conf
#
# HANYA port 80. SSL diterminasi di Nginx Proxy Manager (192.168.1.3), pola sama
# dengan elps.co.id / dek / gis / ben — NPM meneruskan ke 192.168.1.30:80 via http.
#
# Pemasangan di VM (butuh sudo):
#   sudo cp carva.elps.co.id.conf /etc/apache2/sites-available/
#   sudo a2ensite carva.elps.co.id
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Uji tanpa menunggu DNS, dari mesin mana pun di jaringan:
#   curl -I -H "Host: carva.elps.co.id" http://192.168.1.30/

<VirtualHost *:80>
    ServerName carva.elps.co.id

    DocumentRoot /var/www/html/carva

    <Directory /var/www/html/carva>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Situs statis murni — tidak ada PHP, tidak ada database.
    # Company profile PDF berukuran 52 MB; biarkan Apache melayaninya langsung.
    ErrorLog  ${APACHE_LOG_DIR}/carva.elps.co.id-error.log
    CustomLog ${APACHE_LOG_DIR}/carva.elps.co.id-access.log combined
</VirtualHost>
